# /etc/nginx/sites-available/green-decor
# Замените YOUR_DOMAIN на реальный домен и создайте симлинк в sites-enabled.

upstream green_decor_app {
    server unix:/run/green-decor.sock fail_timeout=0;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 10M;

    # Логи
    access_log /var/log/nginx/green-decor.access.log;
    error_log  /var/log/nginx/green-decor.error.log;

    # Загружаемые фото
    location /media/ {
        alias /var/lib/green-decor/media/;
        access_log off;
        expires 30d;
    }

    # Статика (WhiteNoise отдаст с manifest-хешем, но nginx кеширует один слой сверху)
    location /static/ {
        alias /srv/green-decor/app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_pass http://green_decor_app;
    }
}
